<div class="login-wrapper">
  <div class="login-card">
    
    <!-- Header Section -->
    <h1 class="brand-title">PolicyGPT</h1>
    <p class="brand-subtitle">Government Policy & Public Scheme Intelligence Platform</p>
    
    <div class="icon-container">
      <div class="building-icon">🏛️</div>
    </div>

    <!-- Form Section -->
    <form class="login-form">
      
      <!-- Role Selection -->
      <div class="form-group">
        <label for="role">Select Role*</label>
        <div class="select-wrapper">
          <select id="role" name="role">
            <option value="Citizen">Citizen</option>
            <option value="Officer">Government Officer</option>
            <option value="Admin">Administrator</option>
          </select>
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group input-with-icon">
        <input type="email" placeholder="Email Address*" required />
        <span class="icon">✉</span>
      </div>

      <!-- Password Field -->
      <div class="form-group input-with-icon">
  <input 
    [type]="showPassword ? 'text' : 'password'" 
    placeholder="Password*" 
    required />
  
  <span 
    class="toggle-eye-btn" 
    (click)="togglePasswordVisibility()">
    {{ showPassword ? '🙈' : '👁️' }}
  </span>
</div>
      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="submit-btn">Sign In</button>

    </form>

    <!-- Footer Links -->
    <div class="card-footer">
      <p class="register-text">
        Don't have an account? <a routerLink="/register" class="register-link">Register Here</a>
      </p>
      <a href="#" class="guest-link">Continue as Guest User</a>
    </div>

  </div>
</div>
