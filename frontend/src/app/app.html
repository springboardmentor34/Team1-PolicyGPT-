<!-- Top Government Identity Bar across 100% full screen width -->
<div class="gov-top-bar">
  <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid fa-landmark text-warning"></i>
      <span><strong>Government of India</strong> | Policy & Public Scheme Intelligence Platform</span>
    </div>
    <div class="d-flex align-items-center gap-4">
      <span><i class="fa-solid fa-phone me-1 text-warning"></i> Helpline: 1800-11-2024</span>
      <span><i class="fa-solid fa-globe me-1 text-warning"></i> English / Hindi</span>
    </div>
  </div>
</div>

<!-- Authenticated User App Layout -->
<ng-container *ngIf="authService.isAuthenticated(); else publicLayout">
  <div class="gov-app-layout">
    <app-header class="gov-sidebar-container"></app-header>
    <main class="gov-main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-container>

<!-- Unauthenticated Public Visitor Layout -->
<ng-template #publicLayout>
  <div class="d-flex flex-column min-vh-100" style="margin-top: var(--topbar-height);">
    <app-header></app-header>
    <main class="flex-grow-1">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
</ng-template>
